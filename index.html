<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경영전략부 업무 캘린더 - 개선판</title>
<style>
:root{--navy:#1e6091;--blue:#2563eb;--line:#dbe1e8;--muted:#64748b;--bg:#f5f7fb;--red:#dc2626;--green:#15803d;--purple:#7c3aed;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0;font-family:Pretendard,"Malgun Gothic",sans-serif}
body{height:100vh;min-height:620px;display:flex;flex-direction:column;background:var(--bg);color:#1f2937;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:12px 18px;flex-shrink:0}
.logo-area{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:9px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:7px;padding:8px 11px;font-size:.83rem;font-weight:700}
.btn-primary{background:var(--blue);color:white}.btn-white{background:white;color:var(--navy)}.btn-outline{background:white;border-color:var(--line);color:#334155}.btn-danger{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.main-container{display:grid;grid-template-columns:240px minmax(420px,1fr) 290px;flex:1;min-height:0}
.left-sidebar,.todo-sidebar{background:white;padding:14px;overflow-y:auto;min-height:0}
.left-sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.todo-sidebar{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.mini-cal{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfdff}
.mini-cal-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.9rem;margin-bottom:8px}
.mini-cal table{width:100%;border-collapse:collapse;text-align:center;font-size:.75rem}
.mini-cal th,.mini-cal td{padding:5px 1px}
.mini-cal td{cursor:pointer;border-radius:5px}.mini-cal td:hover{background:#e0edff}.mini-cal td.today{background:var(--blue);color:white;font-weight:800}.mini-cal td.selected{outline:2px solid #93c5fd}
.section-label{font-size:.78rem;font-weight:800;color:#475569;margin-bottom:7px}
.cal-group{background:#f8fafc;border:1px solid #e8edf3;border-radius:8px;padding:10px}
.cal-group-header{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;font-weight:800;margin-bottom:8px}
.edit-btn{border:0;background:none;color:var(--muted);font-size:.72rem;text-decoration:underline}
.cal-item{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:8px 0;cursor:pointer}
.cal-item input{accent-color:var(--blue)}
.color-dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.calendar-area{padding:15px;overflow:auto;display:flex;flex-direction:column;min-width:0}
.calendar-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.month-controls{display:flex;align-items:center;gap:8px}.calendar-title{font-size:1.35rem;font-weight:850;min-width:150px}
.icon-btn{background:white;border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:#334155}
.view-controls{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.search-input{border:1px solid var(--line);background:white;border-radius:7px;padding:7px 9px;font-size:.8rem}
.quick-filters{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.quick-filter{border:1px solid var(--line);background:#fff;color:#475569;border-radius:999px;padding:6px 10px;font-size:.75rem;font-weight:700}
.quick-filter.active{background:#dbeafe;border-color:#93c5fd;color:#1e40af}

.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:white;flex:1;min-height:500px;grid-auto-rows:minmax(95px,1fr)}
.day-header{background:#eef2f7;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;text-align:center;font-size:.8rem;font-weight:800}
.day-header:first-child{color:#dc2626}.day-header:last-child{color:#2563eb}
.calendar-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:#fff}
.calendar-cell:hover{background:#f8fbff}.calendar-cell.other-month{background:#f8fafc;color:#9ca3af}.calendar-cell.today-cell{background:#eff6ff}.calendar-cell.has-urgent{box-shadow:inset 0 0 0 1px #fda4af;background:#fff8f8}
.day-num{font-size:.78rem;font-weight:800;display:flex;justify-content:space-between;gap:3px}.day-num.sun{color:#dc2626}.day-num.sat{color:#2563eb}
.event-chip{font-size:.69rem;line-height:1.35;padding:4px 5px;border-radius:5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;width:100%;cursor:pointer}
.event-chip.cat-회계{background:#dbeafe;color:#1e40af}.event-chip.cat-자금{background:#dcfce7;color:#166534}.event-chip.cat-인사{background:#ffedd5;color:#9a3412}.event-chip.cat-총무{background:#ede9fe;color:#5b21b6}.event-chip.cat-공통{background:#ffe4e6;color:#9f1239}
.event-chip.urgent{outline:1px solid #fb7185;font-weight:800}.event-chip.custom-color{color:#263244!important;border:1px solid #cbd5e1}.holiday-label{font-size:.65rem;color:#dc2626;font-weight:800;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dday{font-size:.62rem;font-weight:800;color:#b91c1c;margin-left:3px}.quick-link-row,.overdue-row{display:flex;align-items:flex-start;gap:6px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:.78rem}.quick-link-row a{color:#1d4ed8;text-decoration:none;overflow-wrap:anywhere;flex:1}.quick-link-row a:hover{text-decoration:underline}.overdue-row button{border:0;background:none;text-align:left;color:#b91c1c;font-size:.78rem;cursor:pointer}.diary-entry{border:1px solid #e2e8f0;background:#f8fafc;border-radius:7px;padding:8px;margin-top:6px;font-size:.78rem;white-space:pre-wrap}.diary-entry time{display:block;color:#64748b;font-size:.68rem;margin-bottom:4px}.small-action{border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 7px;font-size:.72rem;color:#334155}.event-chip.completed{text-decoration:line-through;opacity:.55;background:#e5e7eb;color:#64748b}
.more-events{font-size:.68rem;color:#64748b;padding-left:3px}
.panel-title{font-size:.98rem;font-weight:850}.subtle{font-size:.75rem;color:var(--muted)}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.summary-card{padding:10px;border:1px solid #e5eaf0;border-radius:8px;background:#fbfdff}.summary-card span{display:block;font-size:.72rem;color:var(--muted)}.summary-card strong{font-size:1.2rem;display:block;margin-top:3px}
.add-todo-box{display:flex;flex-direction:column;gap:7px;padding:10px;background:#f8fafc;border:1px solid #e5eaf0;border-radius:8px}
.field{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;background:white;font-size:.82rem}
.todo-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.todo-item{display:flex;align-items:flex-start;gap:7px;padding:9px;border:1px solid #e5eaf0;border-radius:7px;font-size:.8rem;background:white}
.todo-item input{margin-top:3px;accent-color:var(--blue)}.todo-text{flex:1;overflow-wrap:anywhere}.todo-item.completed .todo-text{text-decoration:line-through;color:#94a3b8}
.tag{font-size:.65rem;padding:3px 5px;border-radius:4px;font-weight:800;white-space:nowrap}.tag.회계{background:#dbeafe;color:#1e40af}.tag.자금{background:#dcfce7;color:#166534}.tag.인사{background:#ffedd5;color:#9a3412}.tag.총무{background:#ede9fe;color:#5b21b6}.tag.공통{background:#ffe4e6;color:#9f1239}
.todo-actions{display:flex;gap:4px}.tiny-btn{border:0;background:transparent;color:#64748b;font-size:.75rem;padding:2px}
.status-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;padding:7px 0;border-bottom:1px solid #f1f5f9}
.status-pill{font-size:.68rem;border-radius:99px;padding:3px 6px;background:#f1f5f9;color:#475569;white-space:nowrap}.status-pill.지연{background:#fee2e2;color:#b91c1c}.status-pill.완료{background:#dcfce7;color:#166534}.status-pill.결재대기,.status-pill.자료대기{background:#fef3c7;color:#92400e}
.empty-state{font-size:.8rem;color:#94a3b8;text-align:center;padding:18px 5px}
.modal-backdrop{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:12px;box-shadow:0 20px 60px #0f172a33;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-header h2{font-size:1.1rem}.close-btn{border:0;background:none;font-size:1.5rem;color:#64748b}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-row{display:flex;flex-direction:column;gap:5px}.form-row.full{grid-column:1/-1}.form-row label{font-size:.78rem;font-weight:800;color:#475569}
textarea.field{min-height:76px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}.modal-actions div{display:flex;gap:7px}
.footer-note{font-size:.7rem;color:#94a3b8;line-height:1.45}
.list-view{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.list-row{display:grid;grid-template-columns:100px 1fr 80px 90px;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #eef2f7;font-size:.8rem}.list-row:last-child{border-bottom:0}.list-row.header{background:#f1f5f9;font-weight:800}
@media(max-width:1100px){.main-container{grid-template-columns:200px minmax(350px,1fr)}.todo-sidebar{display:none}}
@media(max-width:720px){body{height:auto;min-height:100vh;overflow:auto}.main-container{display:flex;flex-direction:column;overflow:visible}.left-sidebar{display:none}.calendar-area{overflow:visible;padding:8px}.calendar-grid{grid-auto-rows:minmax(78px,auto);min-height:0}.calendar-cell{padding:3px}.event-chip{font-size:.62rem;padding:3px}.calendar-title{font-size:1.1rem}.todo-sidebar{display:flex;border-left:0;border-top:1px solid var(--line)}header{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.form-row.full{grid-column:auto}.list-row{grid-template-columns:75px 1fr 60px}.list-row .list-status{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo-area"><span>📅</span><span>경영전략부 업무 캘린더</span></div>
  <div class="header-actions">
    <button class="btn btn-white" onclick="openTaskModal()">＋ 업무 추가</button>
    <button class="btn btn-white" onclick="exportJSON()">백업 내보내기</button>
    <button class="btn btn-white" onclick="document.getElementById('importFile').click()">백업 복원</button>
    <button class="btn btn-white" onclick="exportCSV()">업무 목록 CSV</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importJSON(event)">
  </div>
</header>
<div class="main-container">
  <aside class="left-sidebar">
    <div class="mini-cal">
      <div class="mini-cal-title"><button class="tiny-btn" onclick="changeMonth(-1)">◀</button><span id="miniTitle"></span><button class="tiny-btn" onclick="changeMonth(1)">▶</button></div>
      <table><thead><tr><th style="color:#dc2626">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th style="color:#2563eb">토</th></tr></thead><tbody id="miniBody"></tbody></table>
    </div>
    <div class="cal-group">
      <div class="cal-group-header"><span>업무 분야</span><button class="edit-btn" onclick="setAllCategories(true)">전체 선택</button></div>
      <label class="cal-item"><input type="checkbox" class="cat-filter" value="회계" checked onchange="renderAll()"><span class="color-dot" style="background:#93c5fd"></span>회계</label>
      <label class="cal-item"><input type="checkbox" class="cat-filter" value="자금" checked onchange="renderAll()"><span class="color-dot" style="background:#86efac"></span>자금</label>
      <label class="cal-item"><input type="checkbox" class="cat-filter" value="인사" checked onchange="renderAll()"><span class="color-dot" style="background:#fdba74"></span>인사</label>
      <label class="cal-item"><input type="checkbox" class="cat-filter" value="총무" checked onchange="renderAll()"><span class="color-dot" style="background:#c4b5fd"></span>총무</label>
      <label class="cal-item"><input type="checkbox" class="cat-filter" value="공통" checked onchange="renderAll()"><span class="color-dot" style="background:#fda4af"></span>공통</label>
    </div>
    <div class="cal-group">
      <div class="cal-group-header"><span>진행 상태</span></div>
      <label class="cal-item"><input type="checkbox" id="showCompleted" checked onchange="renderAll()">완료 업무 표시</label>
      <label class="cal-item"><input type="checkbox" id="showOverdue" checked onchange="renderAll()">지연 업무 표시</label>
    </div>
    <div class="cal-group">
      <div class="cal-group-header"><span>개인 설정</span><button class="edit-btn" onclick="editProfile()">수정</button></div>
      <div class="subtle" id="profileText">개인 업무 공간</div>
    </div>
    <div class="footer-note">데이터는 이 브라우저에 저장됩니다. 정기적으로 백업 파일을 내려받아 보관하세요.</div>
  </aside>
  <section class="calendar-area">
    <div class="calendar-header">
      <div class="month-controls"><button class="icon-btn" onclick="changeMonth(-1)">‹</button><div class="calendar-title" id="calendarTitle"></div><button class="icon-btn" onclick="changeMonth(1)">›</button><button class="icon-btn" onclick="goToday()">오늘</button></div>
      <div class="view-controls"><button class="btn btn-outline" id="monthViewBtn" onclick="setView('month')">월간</button><button class="btn btn-outline" id="listViewBtn" onclick="setView('list')">목록</button></div>
    </div>
    <div class="filters">
      <select id="statusFilter" onchange="clearQuickFilter();renderAll()"><option value="all">모든 상태</option><option value="예정">예정</option><option value="진행 중">진행 중</option><option value="결재 대기">결재 대기</option><option value="자료 대기">타부서 자료 대기</option><option value="완료">완료</option><option value="지연">지연</option></select>
      <input class="search-input" id="searchInput" placeholder="업무명·메모 검색" oninput="renderAll()">
    </div>
    <div class="quick-filters" aria-label="빠른 업무 필터">
      <button class="quick-filter active" id="qf-all" onclick="quickFilter('all')">전체</button>
      <button class="quick-filter" id="qf-week" onclick="quickFilter('week')">7일 이내 마감</button>
      <button class="quick-filter" id="qf-waiting" onclick="quickFilter('waiting')">결재·자료 대기</button>
      <button class="quick-filter" id="qf-overdue" onclick="quickFilter('overdue')">지연 업무</button>
    </div>
    <div id="calendarContent"></div>
  </section>
  <aside class="todo-sidebar">
    <div class="panel-title">업무 현황</div>
    <div class="summary-grid">
      <div class="summary-card"><span>이번 달 업무</span><strong id="sumTotal">0</strong></div>
      <div class="summary-card"><span>완료</span><strong id="sumDone">0</strong></div>
      <div class="summary-card"><span>진행 중</span><strong id="sumDoing">0</strong></div>
      <div class="summary-card"><span>지연 / 확인 필요</span><strong id="sumAlert">0</strong></div>
    </div>
    <div class="panel-title" id="selectedDateTitle">선택 날짜 업무</div>
    <div class="subtle" id="selectedDateSubtitle"></div>
    <div class="add-todo-box">
      <input id="quickTitle" class="field" placeholder="빠른 업무 추가 후 Enter" onkeydown="if(event.key==='Enter')quickAdd()">
      <select id="quickCategory" class="field"><option>회계</option><option>자금</option><option>인사</option><option>총무</option><option>공통</option></select>
      <button class="btn btn-primary" onclick="quickAdd()">선택 날짜에 추가</button>
    </div>
    <ul class="todo-list" id="selectedTasks"></ul>
    <div class="panel-title">다가오는 업무</div>
    <div id="upcomingList"></div>
    <div class="panel-title">지연 업무 모아보기 <span id="overdueCount" class="subtle"></span></div>
    <div id="overdueList"></div>
    <div class="panel-title">자주 쓰는 업무 바로가기</div>
    <div id="quickLinksList"></div>
    <button class="small-action" onclick="manageQuickLinks()">＋ 바로가기 추가·관리</button>
    <button class="small-action" onclick="manageHolidays()">공휴일·임시공휴일 관리</button>
  </aside>
</div>

<div class="modal-backdrop" id="taskModal" role="dialog" aria-modal="true">
 <div class="modal">
  <div class="modal-header"><h2 id="modalTitle">업무 등록</h2><button class="close-btn" onclick="closeTaskModal()" aria-label="닫기">×</button></div>
  <form id="taskForm" onsubmit="saveTask(event)">
   <input type="hidden" id="taskId">
   <div class="form-grid">
    <div class="form-row full"><label for="taskTitle">업무명 *</label><input class="field" id="taskTitle" required maxlength="150" placeholder="예: 월말 결산 및 전표 검토"></div>
    <div class="form-row"><label for="taskDate">마감일 *</label><input class="field" id="taskDate" type="date" required></div>
    <div class="form-row"><label for="taskCategory">업무 분야</label><select class="field" id="taskCategory"><option>회계</option><option>자금</option><option>인사</option><option>총무</option><option>공통</option></select></div>
    <div class="form-row"><label for="taskStatus">진행 상태</label><select class="field" id="taskStatus"><option>예정</option><option>진행 중</option><option>결재 대기</option><option>자료 대기</option><option>완료</option></select></div>
    <div class="form-row"><label for="taskPriority">중요도</label><select class="field" id="taskPriority"><option value="normal">보통</option><option value="important">중요</option><option value="urgent">긴급</option></select></div>
    <div class="form-row"><label for="taskRepeat">반복 주기</label><select class="field" id="taskRepeat"><option value="none">반복 없음</option><option value="monthly">매월</option><option value="quarterly">분기별</option><option value="yearly">매년</option></select></div>
    <div class="form-row"><label for="taskColor">달력 형광펜 / 배경색</label><select class="field" id="taskColor"><option value="">기본 색상(분야별)</option><option value="#fff3a3">노랑 형광펜</option><option value="#d9f99d">연두 형광펜</option><option value="#fecdd3">분홍</option><option value="#bfdbfe">하늘색</option><option value="#ddd6fe">연보라</option><option value="#fed7aa">살구색</option></select></div>
    <div class="form-row"><label for="taskActualDate">실제 완료일</label><input class="field" id="taskActualDate" type="date"></div>
    <div class="form-row full"><label for="taskMemo">메모 / 증빙 / 후속 조치</label><textarea class="field" id="taskMemo" placeholder="필요 서류, 타부서 협조, 다음 조치 등을 입력하세요."></textarea></div>
    <div class="form-row full"><label for="taskLink">관련 링크 (선택)</label><input class="field" id="taskLink" type="url" placeholder="https://..."></div>
    <div class="form-row full"><label for="taskDiary">업무 진행 일지 추가</label><textarea class="field" id="taskDiary" placeholder="예: 10/19 거래명세서 수령 요청 완료. 회신 대기 중."></textarea><span class="subtle">저장할 때 작성한 내용이 날짜·시간과 함께 일지 이력에 추가됩니다.</span><div id="taskDiaryHistory"></div></div>
   </div>
   <div class="modal-actions"><div><button type="button" class="btn btn-danger" id="deleteTaskBtn" onclick="deleteCurrentTask()" style="display:none">삭제</button></div><div><button type="button" class="btn btn-outline" onclick="closeTaskModal()">취소</button><button type="submit" class="btn btn-primary">저장</button></div></div>
  </form>
 </div>
</div>

<script>
const STORAGE_KEY='management-calendar-v1';
const $=id=>document.getElementById(id);
const today=new Date();
let viewYear=today.getFullYear(),viewMonth=today.getMonth(),selectedDate=toISO(today),viewMode='month';
let activeQuickFilter='all';
let profile={name:'사용자',company:'경영전략부'};
let tasks=[];
const seedTasks=[

function dateISO(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function toISO(d){return dateISO(d.getFullYear(),d.getMonth()+1,d.getDate())}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function monthLabel(y,m){return `${y}년 ${m+1}월`}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadData(){
 try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);tasks=Array.isArray(data.tasks)?data.tasks:[];profile=data.profile||profile}else{tasks=seedTasks.map(t=>({...t}));saveData()}}
 catch(e){tasks=seedTasks.map(t=>({...t}));}
 $('profileText').textContent=`${profile.name} · ${profile.company}`;
}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({tasks,profile,updatedAt:new Date().toISOString()}))}catch(e){alert('브라우저 저장에 실패했습니다. 저장 공간을 확인하고 백업해 주세요.')}}
function changeMonth(delta){viewMonth+=delta;if(viewMonth<0){viewYear--;viewMonth=11}if(viewMonth>11){viewYear++;viewMonth=0}renderAll()}
function goToday(){viewYear=today.getFullYear();viewMonth=today.getMonth();selectedDate=toISO(today);renderAll()}
function setView(v){viewMode=v;renderAll()}
function clearQuickFilter(){activeQuickFilter='all';updateQuickFilterButtons()}
function quickFilter(mode){
 activeQuickFilter=mode;
 if(mode==='waiting')$('statusFilter').value='all';
 else if(mode==='overdue')$('statusFilter').value='지연';
 else $('statusFilter').value='all';
 updateQuickFilterButtons();renderAll();
}
function updateQuickFilterButtons(){
 ['all','week','waiting','overdue'].forEach(k=>{const b=$('qf-'+k);if(b)b.classList.toggle('active',activeQuickFilter===k)});
}
function setAllCategories(value){document.querySelectorAll('.cat-filter').forEach(c=>c.checked=value);renderAll()}
function selectedCategories(){return [...document.querySelectorAll('.cat-filter:checked')].map(c=>c.value)}
function isOverdue(t){return t.status!=='완료'&&t.date<toISO(today)}
function visibleTasks(){const cats=selectedCategories(),status=$('statusFilter').value,search=$('searchInput').value.trim().toLowerCase();return tasks.filter(t=>{
 if(!cats.includes(t.category))return false;
 if(t.status==='완료'&&!$('showCompleted').checked)return false;
 if(isOverdue(t)&&!$('showOverdue').checked)return false;
 if(status==='지연'&&!isOverdue(t))return false;
 if(status!=='all'&&status!=='지연'&&t.status!==status)return false;
 if(activeQuickFilter==='week'){
   const d=daysUntil(t.date);
   if(t.status==='완료'||d<0||d>7)return false;
 }
 if(activeQuickFilter==='waiting'&&t.status!=='결재 대기'&&t.status!=='자료 대기')return false;
 if(activeQuickFilter==='overdue'&&!isOverdue(t))return false;
 if(search&&!`${t.title} ${t.memo||''} ${t.category}`.toLowerCase().includes(search))return false;
 return true;
})}
function renderAll(){updateQuickFilterButtons();renderCalendar();renderMini();renderSidebar();$('calendarTitle').textContent=monthLabel(viewYear,viewMonth);$('miniTitle').textContent=monthLabel(viewYear,viewMonth);$('monthViewBtn').style.background=viewMode==='month'?'#dbeafe':'white';$('listViewBtn').style.background=viewMode==='list'?'#dbeafe':'white'}
function renderCalendar(){
 const root=$('calendarContent'),all=visibleTasks();root.innerHTML='';
 if(viewMode==='list'){const first=dateISO(viewYear,viewMonth+1,1),last=dateISO(viewYear,viewMonth+1,new Date(viewYear,viewMonth+1,0).getDate());const arr=all.filter(t=>t.date>=first&&t.date<=last).sort((a,b)=>a.date.localeCompare(b.date));const box=document.createElement('div');box.className='list-view';box.innerHTML='<div class="list-row header"><span>마감일</span><span>업무명</span><span>분야</span><span class="list-status">상태</span></div>'+ (arr.length?arr.map(t=>`<div class="list-row"><span>${t.date}</span><span><button class="tiny-btn" style="font-size:.8rem;color:#1d4ed8" onclick="editTask('${t.id}')">${escapeHTML(t.title)}</button></span><span><span class="tag ${t.category}">${t.category}</span></span><span class="list-status">${escapeHTML(isOverdue(t)?'지연':t.status)}</span></div>`).join(''):'<div class="empty-state">이번 달 등록된 업무가 없습니다.</div>');root.appendChild(box);return}
 const grid=document.createElement('div');grid.className='calendar-grid';['일','월','화','수','목','금','토'].forEach(d=>{const h=document.createElement('div');h.className='day-header';h.textContent=d;grid.appendChild(h)});
 const first=new Date(viewYear,viewMonth,1),start=new Date(viewYear,viewMonth,1-first.getDay()),todayISO=toISO(today);
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=toISO(d),cell=document.createElement('div');cell.className='calendar-cell'+(d.getMonth()!==viewMonth?' other-month':'')+(iso===todayISO?' today-cell':'');cell.dataset.date=iso;const holiday=getHoliday(iso);if(holiday){const hl=document.createElement('div');hl.className='holiday-label';hl.textContent=holiday;cell.appendChild(hl);}
 const day=document.createElement('div');day.className='day-num'+(d.getDay()===0?' sun':d.getDay()===6?' sat':'');day.innerHTML=`<span>${d.getDate()}</span>${iso===todayISO?'<span style="font-size:.62rem;color:#2563eb">오늘</span>':''}`;cell.appendChild(day);
 const dayTasks=all.filter(t=>t.date===iso).sort((a,b)=>priorityOrder(a.priority)-priorityOrder(b.priority));
 if(dayTasks.some(t=>t.priority==='urgent'&&!isOverdue(t)&&t.status!=='완료'))cell.classList.add('has-urgent');
 dayTasks.slice(0,3).forEach(t=>{const chip=document.createElement('button');chip.className=`event-chip cat-${t.category}${t.priority==='urgent'?' urgent':''}${t.status==='완료'?' completed':''}`;chip.title=`${t.title} · ${t.category} · ${t.status}`;const dd=daysUntil(t.date);chip.textContent=(isOverdue(t)?'⚠ ':'')+t.title+(dd===0?' · D-Day':dd>0&&dd<=30?` · D-${dd}`:'');if(t.color){chip.style.backgroundColor=t.color;chip.style.color='#263244';chip.classList.add('custom-color')};chip.onclick=e=>{e.stopPropagation();editTask(t.id)};cell.appendChild(chip)});
 if(dayTasks.length>3){const more=document.createElement('div');more.className='more-events';more.textContent=`+${dayTasks.length-3}건`;cell.appendChild(more)}
 cell.onclick=()=>{selectedDate=iso;openTaskModal(null,iso);renderSidebar()};grid.appendChild(cell);
 }
 root.appendChild(grid);
}
function priorityOrder(p){return p==='urgent'?0:p==='important'?1:2}
function renderMini(){
 const y=viewYear,m=viewMonth,first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),body=$('miniBody');body.innerHTML='';
 for(let r=0;r<6;r++){const tr=document.createElement('tr');for(let c=0;c<7;c++){const d=new Date(start);d.setDate(start.getDate()+r*7+c);const iso=toISO(d),td=document.createElement('td');td.textContent=d.getDate();const hol=getHoliday(iso);if(hol){td.title=hol;td.style.color='#dc2626';td.style.fontWeight='800'}if(d.getMonth()!==m)td.style.color='#cbd5e1';if(iso===toISO(today))td.classList.add('today');if(iso===selectedDate)td.classList.add('selected');td.onclick=()=>{selectedDate=iso;viewYear=d.getFullYear();viewMonth=d.getMonth();renderAll()};tr.appendChild(td)}body.appendChild(tr)}
}
function renderSidebar(){
 const monthStart=dateISO(viewYear,viewMonth+1,1),monthEnd=dateISO(viewYear,viewMonth+1,new Date(viewYear,viewMonth+1,0).getDate()),monthTasks=tasks.filter(t=>t.date>=monthStart&&t.date<=monthEnd);
 $('sumTotal').textContent=monthTasks.length;$('sumDone').textContent=monthTasks.filter(t=>t.status==='완료').length;$('sumDoing').textContent=monthTasks.filter(t=>t.status==='진행 중').length;$('sumAlert').textContent=monthTasks.filter(t=>isOverdue(t)||t.status==='결재 대기'||t.status==='자료 대기').length;
 $('selectedDateTitle').textContent='선택 날짜 업무';$('selectedDateSubtitle').textContent=selectedDate;
 const list=$('selectedTasks'),arr=visibleTasks().filter(t=>t.date===selectedDate);list.innerHTML='';
 if(!arr.length)list.innerHTML='<li class="empty-state">이 날짜에 등록된 업무가 없습니다.</li>';
 arr.forEach(t=>{const li=document.createElement('li');li.className='todo-item'+(t.status==='완료'?' completed':'');li.innerHTML=`<input type="checkbox" ${t.status==='완료'?'checked':''} aria-label="완료"><span class="tag ${t.category}">${t.category}</span><span class="todo-text">${escapeHTML(t.title)}<br><span class="subtle">${escapeHTML(isOverdue(t)?'지연':t.status)}</span></span><span class="todo-actions"><button class="tiny-btn" title="수정">✎</button></span>`;
 li.querySelector('input').onchange=()=>{t.status=li.querySelector('input').checked?'완료':'진행 중';if(t.status==='완료')t.actualDate=toISO(today);saveData();renderAll()};
 li.querySelector('button').onclick=()=>editTask(t.id);list.appendChild(li)});
 const upcoming=$('upcomingList'),next=tasks.filter(t=>t.status!=='완료'&&t.date>=toISO(today)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);upcoming.innerHTML=next.length?next.map(t=>`<div class="status-line"><span><strong>${t.date.slice(5)}</strong> · ${escapeHTML(t.title)}</span><span class="status-pill">${t.priority==='urgent'?'긴급':t.status}</span></div>`).join(''):'<div class="empty-state">다가오는 미완료 업무가 없습니다.</div>';
}
function openTaskModal(id=null,date=selectedDate){
 $('taskForm').reset();$('taskId').value='';$('taskDate').value=date||toISO(today);$('taskStatus').value='예정';$('taskRepeat').value='none';$('taskPriority').value='normal';$('taskColor').value='';$('taskDiary').value='';$('taskDiaryHistory').innerHTML='';$('modalTitle').textContent=id?'업무 수정':'업무 등록';$('deleteTaskBtn').style.display=id?'inline-block':'none';
 if(id){const t=tasks.find(x=>x.id===id);if(!t)return;$('taskId').value=t.id;$('taskTitle').value=t.title;$('taskDate').value=t.date;$('taskCategory').value=t.category;$('taskStatus').value=t.status;$('taskPriority').value=t.priority||'normal';$('taskRepeat').value=t.repeat||'none';$('taskActualDate').value=t.actualDate||'';$('taskMemo').value=t.memo||'';$('taskLink').value=t.link||'';$('taskColor').value=t.color||'';$('taskDiaryHistory').innerHTML=renderDiaryHistory(t.logs||[])}
 $('taskModal').classList.add('open');$('taskTitle').focus();
}
function editTask(id){openTaskModal(id)}
function closeTaskModal(){$('taskModal').classList.remove('open')}
function saveTask(e){
 e.preventDefault();const id=$('taskId').value,title=$('taskTitle').value.trim(),date=$('taskDate').value;if(!title||!date)return;
 const existing=id?tasks.find(t=>t.id===id):null;const logs=existing&&Array.isArray(existing.logs)?[...existing.logs]:[];const diaryText=$('taskDiary').value.trim();if(diaryText)logs.push({at:new Date().toISOString(),text:diaryText});const item={id:id||`${Date.now()}-${Math.random().toString(16).slice(2)}`,title,date,category:$('taskCategory').value,status:$('taskStatus').value,priority:$('taskPriority').value,repeat:$('taskRepeat').value,actualDate:$('taskActualDate').value,memo:$('taskMemo').value.trim(),link:$('taskLink').value.trim(),color:$('taskColor').value,logs};
 if(id){const idx=tasks.findIndex(t=>t.id===id);if(idx>=0)tasks[idx]=item}else{tasks.push(item);if(item.repeat!=='none')createRecurring(item)}
 selectedDate=date;const d=parseISO(date);viewYear=d.getFullYear();viewMonth=d.getMonth();saveData();closeTaskModal();renderAll();
}
function createRecurring(t){
 const count=t.repeat==='monthly'?11:t.repeat==='quarterly'?3:t.repeat==='yearly'?3:0;const source=parseISO(t.date);
 for(let i=1;i<=count;i++){let d=new Date(source);if(t.repeat==='monthly')d.setMonth(d.getMonth()+i);if(t.repeat==='quarterly')d.setMonth(d.getMonth()+3*i);if(t.repeat==='yearly')d.setFullYear(d.getFullYear()+i);
 const day=source.getDate();if(d.getDate()!==day)d.setDate(0);
 const date=toISO(d);if(!tasks.some(x=>x.title===t.title&&x.date===date))tasks.push({...t,id:`${t.id}-r${i}`,date,status:'예정',actualDate:''})}
}
function deleteCurrentTask(){const id=$('taskId').value;if(!id)return;if(confirm('이 업무를 삭제할까요?')){tasks=tasks.filter(t=>t.id!==id);saveData();closeTaskModal();renderAll()}}
function quickAdd(){const title=$('quickTitle').value.trim();if(!title)return;tasks.push({id:`${Date.now()}-${Math.random().toString(16).slice(2)}`,title,date:selectedDate,category:$('quickCategory').value,status:'예정',priority:'normal',repeat:'none',memo:''});$('quickTitle').value='';saveData();renderAll()}
function editProfile(){const name=prompt('이름 또는 별칭을 입력하세요.',profile.name);if(name===null)return;const company=prompt('회사 / 부서명을 입력하세요.',profile.company);if(company===null)return;profile={name:name.trim()||'사용자',company:company.trim()||'경영전략부'};saveData();$('profileText').textContent=`${profile.name} · ${profile.company}`}
function exportJSON(){const blob=new Blob([JSON.stringify({tasks,profile,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});downloadBlob(blob,`업무캘린더_백업_${toISO(today)}.json`)}
function importJSON(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.tasks))throw new Error('tasks');if(!confirm('현재 데이터를 가져온 백업 데이터로 교체할까요? 먼저 현재 데이터를 백업하는 것을 권장합니다.'))return;tasks=data.tasks;profile=data.profile||profile;saveData();renderAll();alert('백업 데이터를 복원했습니다.')}catch(err){alert('올바른 업무 캘린더 백업 파일이 아닙니다.')}finally{e.target.value=''}};reader.readAsText(file)}
function exportCSV(){const rows=[['업무명','마감일','분야','상태','중요도','반복주기','실제완료일','메모','관련링크','달력색상','진행일지'],...tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.title,t.date,t.category,t.status,t.priority,t.repeat,t.actualDate||'',t.memo||'',t.link||'',t.color||'',(t.logs||[]).map(l=>`${l.at}: ${l.text}`).join(' | ')])];const csv='\uFEFF'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8;'}),`업무캘린더_목록_${toISO(today)}.csv`)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function daysUntil(date){return Math.round((parseISO(date)-parseISO(toISO(today)))/86400000)}
function renderDiaryHistory(logs){if(!logs||!logs.length)return '<div class="subtle" style="margin-top:6px">아직 작성된 진행 일지가 없습니다.</div>';return logs.slice().reverse().map(l=>`<div class="diary-entry"><time>${escapeHTML(new Date(l.at).toLocaleString('ko-KR'))}</time>${escapeHTML(l.text)}</div>`).join('')}

};
function getHoliday(iso){return (profile.customHolidays||[]).find(h=>h.date===iso)?.name||baseHolidays[iso]||((parseISO(iso).getDay()===0)?'일요일':null)}
function manageHolidays(){const current=profile.customHolidays||[];const action=prompt('공휴일 관리\n1 = 임시공휴일/회사 휴무일 추가\n2 = 직접 추가한 날짜 삭제\n\n등록된 직접 추가 날짜: '+(current.length?current.map(h=>`${h.date} ${h.name}`).join(' / '):'없음'));if(action==='1'){const date=prompt('추가할 날짜를 입력하세요. (YYYY-MM-DD)');if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('날짜 형식은 YYYY-MM-DD로 입력해 주세요.');return}const name=prompt('공휴일 이름 또는 임시공휴일 사유를 입력하세요.');if(!name)return;profile.customHolidays=profile.customHolidays||[];profile.customHolidays=profile.customHolidays.filter(h=>h.date!==date);profile.customHolidays.push({date,name:name.trim()});saveData();renderAll();alert(`${date} ${name} 일정이 공휴일로 표시됩니다.`)}else if(action==='2'){if(!current.length){alert('직접 추가한 공휴일이 없습니다.');return}const n=Number(prompt('삭제할 번호를 입력하세요.\n'+current.map((h,i)=>`${i+1}. ${h.date} ${h.name}`).join('\n')));if(!Number.isInteger(n)||n<1||n>current.length)return;profile.customHolidays.splice(n-1,1);saveData();renderAll()} }
function manageQuickLinks(){profile.quickLinks=profile.quickLinks||[];const action=prompt('바로가기 관리\n1 = 추가\n2 = 삭제\n3 = 전체 초기화');if(action==='1'){const name=prompt('바로가기 이름 (예: 더존 아마란스)');if(!name)return;const url=prompt('접속 주소(URL, https:// 포함)');if(!url)return;try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;profile.quickLinks.push({name:name.trim(),url:u.href});}catch(e){alert('http:// 또는 https:// 주소를 입력해 주세요.');return}}else if(action==='2'){if(!profile.quickLinks.length){alert('등록된 바로가기가 없습니다.');return}const names=profile.quickLinks.map((l,i)=>`${i+1}. ${l.name}`).join('\n');const n=Number(prompt('삭제할 번호를 입력하세요.\n'+names));if(!Number.isInteger(n)||n<1||n>profile.quickLinks.length)return;profile.quickLinks.splice(n-1,1)}else if(action==='3'){if(confirm('등록된 바로가기를 모두 삭제할까요?'))profile.quickLinks=[]}else return;saveData();renderAll()}
const _renderSidebar=renderSidebar;
renderSidebar=function(){_renderSidebar();
 const overdue=$('overdueList'),late=tasks.filter(t=>isOverdue(t)).sort((a,b)=>a.date.localeCompare(b.date));$('overdueCount').textContent=`${late.length}건`;overdue.innerHTML=late.length?late.map(t=>`<div class="overdue-row"><span>⚠</span><button onclick="editTask('${String(t.id).replace(/'/g,"\\'")}')">${escapeHTML(t.title)}<br><span class="subtle">마감 ${escapeHTML(t.date)} · ${Math.abs(daysUntil(t.date))}일 지연</span></button></div>`).join(''):'<div class="empty-state">지연된 업무가 없습니다.</div>';
 const q=$('quickLinksList');const links=profile.quickLinks||[];q.innerHTML=links.length?links.map((l,i)=>`<div class="quick-link-row"><span>↗</span><a href="${escapeHTML(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(l.name)}</a></div>`).join(''):'<div class="subtle">자주 사용하는 사이트를 등록하세요.</div>';
 const upcoming=$('upcomingList');if(upcoming){const next=tasks.filter(t=>t.status!=='완료'&&t.date>=toISO(today)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);upcoming.innerHTML=next.length?next.map(t=>{const dd=daysUntil(t.date);return `<div class="status-line"><span><strong>${escapeHTML(t.date.slice(5))}</strong> · ${escapeHTML(t.title)} <span class="dday">${dd===0?'D-Day':`D-${dd}`}</span></span><span class="status-pill">${t.priority==='urgent'?'긴급':escapeHTML(t.status)}</span></div>`}).join(''):'<div class="empty-state">다가오는 미완료 업무가 없습니다.</div>'}
};

$('taskModal').addEventListener('click',e=>{if(e.target===$('taskModal'))closeTaskModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTaskModal()});
loadData();renderAll();
</script>
