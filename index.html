<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동시테크 업무 및 개인 캘린더</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f8f9fa; color: #333; }
        
        /* 상단 네비게이션바 (그룹웨어 스타일) */
        header { display: flex; justify-content: space-between; align-items: center; background: #1e6091; color: white; padding: 10px 20px; }
        .logo-area { display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 1.1rem; }
        .header-btn { background: #0d47a1; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .login-btn { background: white; color: #1e6091; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }

        /* 메인 레이아웃 (3단) */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* [1단] 왼쪽 사이드바 (그룹웨어 캘린더 리스트 스타일) */
        aside.left-sidebar { width: 250px; background: #fff; border-right: 1px solid #d1d5db; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .add-event-btn { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; margin-bottom: 5px; }
        .mini-cal { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; text-align: center; background: #fafafa; font-size: 0.85rem; }
        
        /* 캘린더 카테고리 (개인 / 회사) */
        .cal-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .cal-group-title { font-size: 0.85rem; font-weight: bold; color: #4b5563; border-bottom: 1px solid #eee; padding-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .cal-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #374151; cursor: pointer; }
        .cal-item input { cursor: pointer; }

        /* [2단] 중앙 캘린더 */
        section.calendar-area { flex: 1; padding: 15px; background: white; display: flex; flex-direction: column; overflow-y: auto; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-title { font-size: 1.3rem; font-weight: 700; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; border-top: 1px solid #d1d5db; border-left: 1px solid #d1d5db; min-height: 550px; }
        .day-header { background: #f3f4f6; border-right: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db; padding: 6px; text-align: center; font-weight: 600; font-size: 0.8rem; }
        .calendar-cell { border-right: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db; padding: 6px; min-height: 95px; background: white; position: relative; }
        .calendar-cell.has-urgent { background-color: #ffe4e6 !important; } /* 긴급 있을 때 연핑크 배경 */
        .day-num { font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }

        /* 일정 칩 스타일 */
        .event-chip { font-size: 0.75rem; padding: 2px 5px; border-radius: 3px; margin-bottom: 3px; cursor: pointer; display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .event-chip.urgent { background: #fecdd3; color: #9f1239; font-weight: bold; }
        .event-chip.normal { background: #dbeafe; color: #1e40af; }
        .event-chip.daily { background: #dcfce7; color: #166534; }
        .event-chip.completed { text-decoration: line-through; opacity: 0.55; background: #e5e7eb !important; color: #6b7280 !important; }

        /* [3단] 오른쪽 To-Do 사이드바 */
        aside.todo-sidebar { width: 300px; background: white; border-left: 1px solid #d1d5db; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .todo-header { font-size: 1rem; font-weight: 700; color: #111827; }
        
        .add-todo-box { display: flex; flex-direction: column; gap: 6px; background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; }
        .todo-select { padding: 5px; border-radius: 4px; border: 1px solid #d1d5db; font-size: 0.8rem; }
        .todo-input { width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.8rem; }
        .add-btn { background: #2563eb; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }

        /* To-Do 리스트 */
        .todo-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .todo-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; padding: 6px; border: 1px solid #f3f4f6; border-radius: 4px; cursor: pointer; }
        .todo-item.completed span.todo-text { text-decoration: line-through; color: #9ca3af; }
        
        .tag { font-size: 0.68rem; padding: 1px 4px; border-radius: 3px; font-weight: bold; }
        .tag.urgent { background: #ffe4e6; color: #e11d48; }
        .tag.normal { background: #e0f2fe; color: #0284c7; }
        .tag.daily { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        <div class="logo-area">
            <span>☰ 일정 HOME</span>
        </div>
        <button class="login-btn" onclick="alert('구글 계정을 통한 자동 백업 및 기기 간 동기화가 설정됩니다.')">
            <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/></svg>
            구글 로그인 / 백업
        </button>
    </header>

    <div class="main-container">
        <!-- [1단] 왼쪽 사이드바 -->
        <aside class="left-sidebar">
            <button class="add-event-btn" onclick="alert('신규 일정 등록 창이 열립니다.')">+ 일정 등록</button>
            
            <div class="mini-cal">
                <strong>2026.10</strong>
            </div>

            <!-- 개인 캘린더 그룹 -->
            <div class="cal-group">
                <div class="cal-group-title">📂 개인 캘린더</div>
                <label class="cal-item">
                    <input type="checkbox" id="chk-personal" checked onchange="toggleCalendarCategory()">
                    <span>개인캘린더.한송희</span>
                </label>
                <label class="cal-item">
                    <input type="checkbox" id="chk-todo" checked onchange="toggleCalendarCategory()">
                    <span>개인 To-Do</span>
                </label>
            </div>

            <!-- 공유 / 회사 캘린더 그룹 -->
            <div class="cal-group">
                <div class="cal-group-title">🏢 공유 캘린더 (회사)</div>
                <label class="cal-item">
                    <input type="checkbox" id="chk-company" checked onchange="toggleCalendarCategory()">
                    <span style="color: #2563eb;">[동시테크] 경영전략부</span>
                </label>
                <label class="cal-item">
                    <input type="checkbox" id="chk-shared" checked onchange="toggleCalendarCategory()">
                    <span>부서 공통 일정</span>
                </label>
            </div>
        </aside>

        <!-- [2단] 중앙 캘린더 -->
        <section class="calendar-area">
            <div class="calendar-header">
                <div class="calendar-title">2026.10</div>
            </div>

            <div class="calendar-grid">
                <!-- 요일 -->
                <div class="day-header" style="color: #ef4444;">일</div>
                <div class="day-header">월</div>
                <div class="day-header">화</div>
                <div class="day-header">수</div>
                <div class="day-header">목</div>
                <div class="day-header">금</div>
                <div class="day-header" style="color: #2563eb;">토</div>

                <!-- 10월 예시 셀 -->
                <div class="calendar-cell"><div class="day-num">11</div></div>
                
                <!-- 10/12 (긴급 + 회사 일정) -->
                <div class="calendar-cell has-urgent cell-company">
                    <div class="day-num">12</div>
                    <div class="event-chip urgent" onclick="toggleComplete(this)">[긴급] 원천세 납부 기한</div>
                </div>

                <!-- 10/13 (개인 일정 + 데일리) -->
                <div class="calendar-cell cell-personal">
                    <div class="day-num">13</div>
                    <div class="event-chip daily completed" onclick="toggleComplete(this)">[데일리] 일계표 작성</div>
                </div>

                <div class="calendar-cell"><div class="day-num">14</div></div>

                <!-- 10/15 (긴급 + 회사 일정) -->
                <div class="calendar-cell has-urgent cell-company">
                    <div class="day-num">15</div>
                    <div class="event-chip urgent" onclick="toggleComplete(this)">[긴급] 근로내용확인신고</div>
                </div>

                <!-- 10/16 (보통 + 회사 일정) -->
                <div class="calendar-cell cell-company">
                    <div class="day-num">16</div>
                    <div class="event-chip normal" onclick="toggleComplete(this)">[보통] 대표님 차량 과태료 납부</div>
                </div>

                <div class="calendar-cell"><div class="day-num">17</div></div>
            </div>
        </section>

        <!-- [3단] 오른쪽 To-Do 사이드바 -->
        <aside class="todo-sidebar">
            <div class="todo-header">오늘의 To-Do (10/19)</div>

            <!-- 신규 일정/To-Do 입력 -->
            <div class="add-todo-box">
                <select id="prioritySelect" class="todo-select">
                    <option value="urgent">[긴급] - 연핑크 배경</option>
                    <option value="normal" selected>[보통] - 파란색</option>
                    <option value="daily">[데일리] - 초록색</option>
                </select>
                <input type="text" id="todoInput" class="todo-input" placeholder="할 일 적고 Enter">
                <button class="add-btn" onclick="addTodo()">To-Do 등록</button>
            </div>

            <!-- To-Do 목록 -->
            <ul class="todo-list" id="todoList">
                <li class="todo-item" onclick="toggleTodoItem(this)">
                    <input type="checkbox">
                    <span class="tag urgent">[긴급]</span>
                    <span class="todo-text">부가세 2기 예정 신고 자료 준비</span>
                </li>
                <li class="todo-item completed" onclick="toggleTodoItem(this)">
                    <input type="checkbox" checked>
                    <span class="tag daily">[데일리]</span>
                    <span class="todo-text">통장 잔액 및 입출금 확인</span>
                </li>
            </ul>
        </aside>
    </div>

    <script>
        // 클릭 시 취소선(밑줄 긋기) 토글 기능
        function toggleComplete(element) {
            element.classList.toggle('completed');
        }

        function toggleTodoItem(liElement) {
            const checkbox = liElement.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
            liElement.classList.toggle('completed');
        }

        // To-Do 등록 기능
        function addTodo() {
            const input = document.getElementById('todoInput');
            const priority = document.getElementById('prioritySelect').value;
            const text = input.value.trim();

            if (!text) return;

            const ul = document.getElementById('todoList');
            const li = document.createElement('li');
            li.className = 'todo-item';
            
            let tagText = priority === 'urgent' ? '[긴급]' : (priority === 'daily' ? '[데일리]' : '[보통]');
            
            li.innerHTML = `
                <input type="checkbox" onchange="this.parentElement.classList.toggle('completed')">
                <span class="tag ${priority}">${tagText}</span>
                <span class="todo-text">${text}</span>
            `;

            ul.appendChild(li);
            input.value = '';
        }

        // Enter 키 누르면 바로 등록
        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTodo();
        });

        // 왼쪽 사이드바 캘린더 체크박스 필터링 (개인/회사 On/Off)
        function toggleCalendarCategory() {
            const showPersonal = document.getElementById('chk-personal').checked;
            const showCompany = document.getElementById('chk-company').checked;

            document.querySelectorAll('.cell-personal').forEach(el => {
                el.style.display = showPersonal ? 'block' : 'none';
            });
            document.querySelectorAll('.cell-company').forEach(el => {
                el.style.display = showCompany ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
